name: build-action
on:
  push:
    branch:
      - main
jobs:
  build-auto:
    runs-on: ubuntu-latest
    steps:
      - name: fetch panrom
        uses: actions/checkout@v4 
      - name: images build panrom
        run: docker compose -f compose.yml build
      - name: up panrom
        run: docker compose -f compose.yml up
      - name: ps panrom
        run: docker compose ps
      - name: sleep panrm
        run: sleep 10
      - name: front check
        run: curl --fail http:localhost//80
      - name: back check 
        run: curl --fail http:localhost//5000
      - name: docker login apnrm
        uses: docker/login-action@v4
        with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}
      - name: images tag apnrom
        run: |
          docker tag ajayf:v1 ${{ secrets.DOCKER_USERNAME }}/datalens-front:v1   
          docker tag ajayb:v1 ${{ secrets.DOCKER_PASSWORD }}/datalens-back:v1
      - name: hubla puswh panrom
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/datalens-front:v1
          docker push ${{ secrets.DOCKER_PASSWORD }}/datalens-back:v1    
